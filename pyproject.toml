[build-system]
requires = [
    "setuptools>=64",
    "wheel",
    "setuptools_scm[toml]>=6.2",
]
build-backend = "setuptools.build_meta"

[project]
name = "quantrocket-moonchart"
description = "Performance tear sheets for backtest analysis"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dynamic = ["version"]

authors = [
    { name = "QuantRocket LLC" },
]

dependencies = [
    "matplotlib",
    "pandas",
    "seaborn",
    "quantrocket-client",
    "empyrical",
    "scipy",
]

[tool.setuptools]
packages = ["moonchart"]

[tool.setuptools.package-data]
moonchart = ["py.typed"]

[tool.setuptools_scm]
write_to = "moonchart/_version.py"
version_scheme = "guess-next-dev"
local_scheme = "dirty-tag"